name: Preise aktualisieren

on:
  schedule:
    - cron: '23 */3 * * *'   # alle 3 Stunden: Cardmarket schreibt nachts, kommt aber nicht immer pünktlich
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: preisradar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Gespeicherten Stand holen (Branch daten)
        run: |
          set +e
          git ls-remote --exit-code --heads origin daten >/dev/null
          rc=$?
          set -e
          if [ "$rc" = "0" ]; then
            git fetch --depth=1 origin daten
            git worktree add state FETCH_HEAD
            test -d state/history || { echo "Branch daten ohne history – Abbruch, damit nichts überschrieben wird"; exit 1; }
          elif [ "$rc" = "2" ]; then
            echo "Branch daten existiert noch nicht – erster Lauf"
            mkdir -p state
          else
            echo "git ls-remote fehlgeschlagen (rc=$rc) – Abbruch, damit der Verlauf nicht verloren geht"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cardmarket abrufen, Katalog und Verlauf bauen
        run: python scripts/update.py --state state --site site

      - name: Stand sichern (Branch daten, ohne Historie im Git)
        run: |
          cd state
          rm -rf .git
          git init -q -b daten
          git config user.name "preisradar-bot"
          git config user.email "preisradar-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Stand $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" daten

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
