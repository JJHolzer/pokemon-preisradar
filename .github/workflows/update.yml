name: Preise aktualisieren

on:
  schedule:
    - cron: '23 4 * * *'   # täglich ca. 05:23 / 06:23 Uhr deutscher Zeit
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: preisradar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Gespeicherten Stand holen (Branch daten)
        run: |
          if git ls-remote --exit-code --heads origin daten >/dev/null; then
            git fetch --depth=1 origin daten
            git worktree add state FETCH_HEAD
          else
            mkdir -p state
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cardmarket abrufen, Katalog und Verlauf bauen
        run: python scripts/update.py --state state --site site

      - name: Stand sichern (Branch daten, ohne Historie im Git)
        run: |
          cd state
          rm -rf .git
          git init -q -b daten
          git config user.name "preisradar-bot"
          git config user.email "preisradar-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Stand $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" daten

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
